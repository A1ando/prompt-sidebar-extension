<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">提示词面板</h1>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" title="切换主题" aria-label="切换主题">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
      
      <!-- 新增：导入导出按钮 -->
      <button id="importBtn" class="icon-btn" title="导入 JSON" aria-label="导入">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
      </button>
      <button id="exportBtn" class="icon-btn" title="导出 JSON" aria-label="导出">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      </button>

      <button id="newCardBtn" class="icon-btn primary" title="新建卡片" aria-label="新建卡片">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
    </div>
  </header>

  <!-- 隐藏的文件上传 input -->
  <input type="file" id="fileInput" accept=".json" style="display: none;" />

  <!-- 标签筛选（在搜索栏上方） -->
  <div class="tag-filter" id="tagFilter"></div>

  <!-- 搜索栏 -->
  <div class="search-wrap">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="搜索标题、内容或标签..." />
  </div>

  <div class="card-list" id="cardList"></div>

  <!-- 新建 / 编辑弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">新建提示词</h3>
        <button class="icon-btn" id="modalClose" aria-label="关闭">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="titleInput">标题</label>
          <input type="text" id="titleInput" placeholder="给这段提示词起个名字" />
        </div>
        <div class="field">
          <label for="contentInput">内容</label>
          <textarea id="contentInput" placeholder="系统提示词内容..."></textarea>
        </div>
        <div class="field">
          <label for="tagsInput">标签（用逗号分隔）</label>
          <input type="text" id="tagsInput" placeholder="例如: 写作, 翻译, 代码" />
          <div class="tag-preview" id="tagPreview"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelBtn" class="btn btn-ghost">取消</button>
        <button id="saveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
